name: Daily Readeck
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-reading-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # main is protected by the `main-2` ruleset (PR + required checks).
          # On a personal repo GitHub refuses `github-actions[bot]` as a bypass
          # actor, so this deploy key is a ruleset bypass actor and does the push.
          ssh-key: ${{ secrets.DAILY_PUSH_DEPLOY_KEY }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Readeck script
        env:
          READDECK_API_KEY: ${{ secrets.READDECK_API_KEY }}
        run: bun run scripts/readeck.ts --write

      - uses: stefanzweifel/git-auto-commit-action@v5

      - name: Archive newsletter readeck articles
        env:
          READDECK_API_KEY: ${{ secrets.READDECK_API_KEY }}
        run: bun run scripts/readeck.ts --archive
