name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Tests and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      # `astro check` loads the collections, so this also enforces the content
      # intake rule: every entry's pubDate must agree with its path.
      - name: Type check and content intake
        run: pnpm check

  spellcheck:
    name: Spell check (markdown posts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install codespell
        run: python -m pip install codespell

      - name: Check spelling in markdown posts
        run: |
          rm -rf /tmp/spellcheck
          mkdir -p /tmp/spellcheck
          find src/data -type f -name '*.md' -print0 | while IFS= read -r -d '' f; do
            rel="${f#src/data/}"
            mkdir -p "/tmp/spellcheck/$(dirname "$rel")"
            # Links (text and URL) are out of scope: strip them before checking.
            sed -E 's/\[[^]]*\]\([^)]*\)//g' "$f" > "/tmp/spellcheck/$rel"
          done
          find /tmp/spellcheck -type f -name '*.md' -print0 | xargs -0 codespell --config .codespellrc
