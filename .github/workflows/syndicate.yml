name: Syndicate to Mastodon
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/data/blog/**'

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x
      - name: Syndicate new posts
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: deno run --allow-read --allow-write --allow-env --allow-net scripts/syndicate.ts
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: syndicate posts to mastodon"
